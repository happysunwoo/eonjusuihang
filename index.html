<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>야간 스마트폰 집중 몰입 타이머</title>
  <style>
    :root {
      --bg-color: #0f1015;
      --card-bg: #1a1c23;
      --card-border: #2e323e;
      --accent-green: #00ff88;
      --accent-blue: #00bfff;
      --accent-red: #ff4757;
      --text-main: #f1f2f6;
      --text-sub: #a4b0be;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-bar {
      width: 100%;
      max-width: 720px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: 600;
      font-size: 14px;
      color: var(--accent-green);
    }

    .btn-copy {
      background: rgba(0, 255, 136, 0.1);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-copy:hover {
      background: var(--accent-green);
      color: #000;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header-banner {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }

    h1 {
      font-size: 24px;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .sub-title {
      font-size: 14px;
      color: var(--text-sub);
    }

    .section-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-blue);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }

    .time-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .input-num {
      width: 70px;
      padding: 10px;
      font-size: 18px;
      font-weight: bold;
      background: #0f1015;
      color: var(--accent-green);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      text-align: center;
    }

    .btn-step {
      background: #2b2e3a;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-step:hover {
      background: #3a3f50;
    }

    .preset-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-preset {
      background: rgba(0, 191, 255, 0.1);
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-preset:hover {
      background: var(--accent-blue);
      color: #000;
    }

    .file-upload-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px dashed var(--card-border);
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .file-input {
      display: block;
      margin-top: 6px;
      width: 100%;
      color: var(--text-sub);
      font-size: 13px;
    }

    .app-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .app-chip {
      background: #252834;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .app-chip button {
      background: none;
      border: none;
      color: var(--text-sub);
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .app-chip button:hover {
      color: var(--accent-red);
    }

    .add-app-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .text-input {
      background: #0f1015;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      flex: 1;
    }

    .text-input:focus {
      outline: none;
      border-color: var(--accent-blue);
    }

    .btn-add {
      background: var(--accent-blue);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .preview-meme-box {
      text-align: center;
      margin: 20px 0;
    }

    .preview-meme-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      object-fit: contain;
    }

    .btn-start {
      width: 100%;
      background: var(--accent-green);
      color: #000;
      font-size: 18px;
      font-weight: 700;
      padding: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .btn-start:hover {
      background: #00e676;
      transform: translateY(-2px);
    }

    .timer-screen {
      display: none;
      text-align: center;
      padding: 10px 0;
    }

    .timer-display {
      font-size: 64px;
      font-weight: 800;
      color: var(--accent-green);
      letter-spacing: 2px;
      margin: 20px 0;
      font-family: "Courier New", Courier, monospace;
    }

    .siren-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 16, 21, 0.95);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .siren-content {
      background: var(--card-bg);
      border: 2px solid var(--accent-red);
      border-radius: 16px;
      padding: 30px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px rgba(255, 71, 87, 0.3);
    }

    .siren-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      margin: 15px 0;
      border: 1px solid var(--card-border);
    }

    .mission-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      margin-top: 15px;
    }

    .btn-cancel {
      background: transparent;
      color: var(--text-sub);
      border: 1px solid var(--card-border);
      padding: 10px 20px;
      border-radius: 8px;
      margin-top: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }

    .modal-body {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 90%;
      max-width: 680px;
      padding: 24px;
    }

    textarea.code-area {
      width: 100%;
      height: 320px;
      font-family: monospace;
      font-size: 12px;
      margin-top: 12px;
      background: #0f1015;
      color: var(--accent-green);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <span>야간 스마트폰 사용 관리 시스템</span>
    <button class="btn-copy" onclick="openCodeModal()">코드 복사하기</button>
  </div>

  <div class="container">
    <div class="header-banner">
      <h1>스마트폰 제한 & 공부 타이머</h1>
      <div class="sub-title">설정한 제한시간이 지나면 해제 미션 경보 화면이 작동합니다.</div>
    </div>

    <!-- 설정 화면 -->
    <div id="setup-screen">
      <div class="section-box">
        <div class="section-title">1. 제한시간 설정</div>
        <div class="time-inputs">
          <input type="number" id="input-min" class="input-num" value="30" min="1" max="999"> 분
          <input type="number" id="input-sec" class="input-num" value="0" min="0" max="59"> 초
          <button class="btn-step" onclick="addTime(1)">+1분</button>
          <button class="btn-step" onclick="addTime(5)">+5분</button>
          <button class="btn-step" onclick="addTime(10)">+10분</button>
          <button class="btn-step" onclick="addTime(-1)">-1분</button>
        </div>
        <div class="preset-btns">
          <button class="btn-preset" onclick="setPreset(15)">15분</button>
          <button class="btn-preset" onclick="setPreset(30)">30분</button>
          <button class="btn-preset" onclick="setPreset(45)">45분</button>
          <button class="btn-preset" onclick="setPreset(60)">60분</button>
        </div>
      </div>

      <div class="section-box">
        <div class="section-title">2. 경보음 & 이미지 설정</div>
        
        <div style="margin-bottom: 12px;">
          <label style="font-size:13px; color:var(--text-sub);">경보음 유형 선택:</label>
          <select id="sound-select" class="text-input" style="width:100%; margin-top:6px;" onchange="toggleCustomAudioInput()">
            <option value="siren">기본 전자 경보음 (Web Audio)</option>
            <option value="custom">커스텀 오디오 파일 (.mp3 / .wav)</option>
          </select>
        </div>

        <div id="custom-audio-box" class="file-upload-box" style="display:none;">
          <label style="font-size:13px; color:var(--text-sub);">오디오 파일 업로드:</label>
          <input type="file" id="audio-file" class="file-input" accept="audio/*" onchange="handleAudioUpload(event)">
        </div>

        <div class="file-upload-box">
          <label style="font-size:13px; color:var(--text-sub);">경보 화면 이미지 변경:</label>
          <input type="file" id="image-file" class="file-input" accept="image/*" onchange="handleImageUpload(event)">
        </div>
      </div>

      <div class="section-box">
        <div class="section-title">3. 제한 예외 앱 목록</div>
        <div class="app-tags" id="app-tags">
          <span class="app-chip">전화 <button onclick="removeApp(this)">✕</button></span>
          <span class="app-chip">문자메시지 <button onclick="removeApp(this)">✕</button></span>
          <span class="app-chip">카카오톡 <button onclick="removeApp(this)">✕</button></span>
        </div>
        <div class="add-app-row">
          <input type="text" id="new-app-input" class="text-input" placeholder="허용할 앱 이름 입력">
          <button class="btn-add" onclick="addApp()">추가</button>
        </div>
      </div>

      <div class="section-box">
        <div class="section-title">4. 해제 미션 설정</div>
        <select id="mission-select" class="text-input" style="width:100%;">
          <option value="math">수학 연산 문제 풀기</option>
          <option value="typing">지정된 문장 똑같이 입력하기</option>
        </select>
      </div>

      <div class="preview-meme-box">
        <img id="main-meme-img" class="preview-meme-img" alt="기본 이미지">
      </div>

      <button class="btn-start" onclick="startTimer()">타이머 시작</button>
    </div>

    <!-- 타이머 진행 화면 -->
    <div id="timer-screen" class="timer-screen">
      <div style="color: var(--accent-blue); font-size:14px; font-weight:600;">타이머 진행 중</div>
      <div class="timer-display" id="time-left">00:00</div>
      
      <div class="preview-meme-box">
        <img id="timer-meme-img" class="preview-meme-img">
      </div>

      <div class="section-box" style="text-align:left; margin-top:15px;">
        <span style="font-size:13px; color:var(--text-sub);">사용 허용된 예외 앱:</span>
        <div class="app-tags" id="timer-allowed-apps" style="margin-top:6px;"></div>
      </div>

      <button class="btn-cancel" onclick="cancelTimer()">타이머 취소</button>
    </div>
  </div>

  <!-- 경보 팝업 -->
  <div id="siren-overlay" class="siren-overlay">
    <div class="siren-content">
      <h2 style="color:var(--accent-red); font-size:22px; margin-bottom:8px;">제한시간이 종료되었습니다</h2>
      <p style="font-size:13px; color:var(--text-sub);">경보음을 끄려면 잠금 해제 미션을 완료하세요.</p>
      <img id="siren-meme-img" class="siren-img">
      
      <div class="mission-box">
        <div id="mission-question" style="font-size:15px; color:var(--accent-blue); font-weight:bold; margin-bottom:12px;"></div>
        <input type="text" id="mission-answer" class="text-input" style="width:100%; text-align:center; font-size:16px;" placeholder="답안 입력">
        <button class="btn-start" style="font-size:15px; padding:12px; margin-top:12px; background:var(--accent-red); color:#fff;" onclick="checkMission()">알람 정지</button>
      </div>
    </div>
  </div>

  <!-- 코드 복사 모달 -->
  <div id="code-modal" class="modal">
    <div class="modal-body">
      <h3 style="color:var(--text-main);">전체 HTML 소스코드</h3>
      <textarea id="code-text" class="code-area" readonly></textarea>
      <div style="margin-top:16px; display:flex; gap:10px; justify-content:flex-end;">
        <button class="btn-copy" onclick="copyToClipboard()">클립보드에 복사</button>
        <button class="btn-step" onclick="closeCodeModal()">닫기</button>
      </div>
    </div>
  </div>

  <script>
    // 내장 밈 이미지 Data URL
    const defaultMemeData = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' viewBox='0 0 400 300'><rect width='100%' height='100%' fill='%23111'/><circle cx='200' cy='150' r='100' fill='%238a532d'/><circle cx='160' cy='130' r='20' fill='%23fff'/><circle cx='240' cy='130' r='20' fill='%23fff'/><circle cx='160' cy='130' r='8' fill='%23000'/><circle cx='240' cy='130' r='8' fill='%23000'/><ellipse cx='200' cy='190' rx='35' ry='45' fill='%23000'/><text x='200' y='270' font-size='20' fill='%23ff0000' font-weight='bold' text-anchor='middle'>경악! 스마트폰 과다사용 감지!</text></svg>";

    let timerInterval = null;
    let totalSeconds = 0;
    let customAudioData = null;
    let customImageData = defaultMemeData;
    let audioCtx = null;
    let sirenOscillator = null;
    let isSirenPlaying = false;
    let currentMathAnswer = 0;
    const typingTarget = "지금 잠을 자면 꿈을 꾸지만 공부를 하면 꿈을 이룬다";

    window.onload = function() {
      document.getElementById('main-meme-img').src = customImageData;
      document.getElementById('timer-meme-img').src = customImageData;
      document.getElementById('siren-meme-img').src = customImageData;
    };

    function addTime(mins) {
      const minInput = document.getElementById('input-min');
      let val = parseInt(minInput.value) || 0;
      val = Math.max(1, val + mins);
      minInput.value = val;
    }

    function setPreset(mins) {
      document.getElementById('input-min').value = mins;
      document.getElementById('input-sec').value = 0;
    }

    function toggleCustomAudioInput() {
      const val = document.getElementById('sound-select').value;
      document.getElementById('custom-audio-box').style.display = val === 'custom' ? 'block' : 'none';
    }

    function handleAudioUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) { customAudioData = evt.target.result; };
        reader.readAsDataURL(file);
      }
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          customImageData = evt.target.result;
          document.getElementById('main-meme-img').src = customImageData;
          document.getElementById('timer-meme-img').src = customImageData;
          document.getElementById('siren-meme-img').src = customImageData;
        };
        reader.readAsDataURL(file);
      }
    }

    function addApp() {
      const input = document.getElementById('new-app-input');
      const val = input.value.trim();
      if (val) {
        const tagsBox = document.getElementById('app-tags');
        const span = document.createElement('span');
        span.className = 'app-chip';
        span.innerHTML = `${val} <button onclick="removeApp(this)">✕</button>`;
        tagsBox.appendChild(span);
        input.value = '';
      }
    }

    function removeApp(btn) {
      btn.parentElement.remove();
    }

    function startTimer() {
      const mins = parseInt(document.getElementById('input-min').value) || 0;
      const secs = parseInt(document.getElementById('input-sec').value) || 0;
      totalSeconds = (mins * 60) + secs;

      if (totalSeconds <= 0) {
        alert("시간을 올바르게 설정해 주세요.");
        return;
      }

      const chips = document.querySelectorAll('#app-tags .app-chip');
      const allowedBox = document.getElementById('timer-allowed-apps');
      allowedBox.innerHTML = '';
      chips.forEach(chip => {
        const text = chip.childNodes[0].textContent.trim();
        const newChip = document.createElement('span');
        newChip.className = 'app-chip';
        newChip.textContent = text;
        allowedBox.appendChild(newChip);
      });

      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('timer-screen').style.display = 'block';

      updateTimerDisplay();
      timerInterval = setInterval(() => {
        totalSeconds--;
        updateTimerDisplay();
        if (totalSeconds <= 0) {
          clearInterval(timerInterval);
          triggerSiren();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      document.getElementById('time-left').textContent = 
        `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function cancelTimer() {
      clearInterval(timerInterval);
      document.getElementById('setup-screen').style.display = 'block';
      document.getElementById('timer-screen').style.display = 'none';
    }

    function triggerSiren() {
      document.getElementById('siren-overlay').style.display = 'flex';
      playAlarmSound();
      setupMission();
    }

    function playAlarmSound() {
      const soundType = document.getElementById('sound-select').value;
      if (soundType === 'custom' && customAudioData) {
        const audio = new Audio(customAudioData);
        audio.loop = true;
        audio.play();
        window.currentCustomAudio = audio;
      } else {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          sirenOscillator = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          sirenOscillator.type = 'sawtooth';
          sirenOscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
          
          let freq = 440;
          let rising = true;
          isSirenPlaying = true;
          
          setInterval(() => {
            if (!isSirenPlaying) return;
            if (rising) {
              freq += 40;
              if (freq > 880) rising = false;
            } else {
              freq -= 40;
              if (freq < 440) rising = true;
            }
            if (sirenOscillator && audioCtx) {
              sirenOscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            }
          }, 40);

          sirenOscillator.connect(gain);
          gain.connect(audioCtx.destination);
          sirenOscillator.start();
        } catch(e) { console.log(e); }
      }
    }

    function stopAlarmSound() {
      isSirenPlaying = false;
      if (window.currentCustomAudio) {
        window.currentCustomAudio.pause();
      }
      if (sirenOscillator) {
        sirenOscillator.stop();
      }
      if (audioCtx) {
        audioCtx.close();
      }
    }

    function setupMission() {
      const type = document.getElementById('mission-select').value;
      const qBox = document.getElementById('mission-question');
      document.getElementById('mission-answer').value = '';

      if (type === 'math') {
        const num1 = Math.floor(Math.random() * 30) + 12;
        const num2 = Math.floor(Math.random() * 8) + 3;
        currentMathAnswer = num1 * num2;
        qBox.textContent = `연산 문제: ${num1} × ${num2} = ?`;
      } else {
        qBox.textContent = `입력 문장: "${typingTarget}"`;
      }
    }

    function checkMission() {
      const type = document.getElementById('mission-select').value;
      const ans = document.getElementById('mission-answer').value.trim();

      if (type === 'math') {
        if (parseInt(ans) === currentMathAnswer) {
          stopSiren();
        } else {
          alert('정답이 아닙니다. 다시 시도해 주세요.');
        }
      } else {
        if (ans === typingTarget) {
          stopSiren();
        } else {
          alert('문장이 정확히 일치하지 않습니다.');
        }
      }
    }

    function stopSiren() {
      stopAlarmSound();
      document.getElementById('siren-overlay').style.display = 'none';
      document.getElementById('setup-screen').style.display = 'block';
      document.getElementById('timer-screen').style.display = 'none';
    }

    function openCodeModal() {
      document.getElementById('code-text').value = document.documentElement.outerHTML;
      document.getElementById('code-modal').style.display = 'flex';
    }

    function closeCodeModal() {
      document.getElementById('code-modal').style.display = 'none';
    }

    function copyToClipboard() {
      const textarea = document.getElementById('code-text');
      textarea.select();
      document.execCommand('copy');
      alert('클립보드에 코드가 복사되었습니다.');
    }
  </script>
</body>
</html>
